<!--
  Minimal Fuuz dashboard template — KPI cards + table
  Replace the contents of <script id="data-renderer"> to suit your dashboard.

  The flow's saved script wraps this in TPL_HEAD + JSON.stringify(state) + TPL_TAIL.
  Split this file at "const STATE =" / "STATE;" to get the HEAD/TAIL halves.
-->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root, :root[data-theme="dark"] {
    --bg: #0b0f17;
    --panel: #131826;
    --panel-2: #1c2333;
    --text: #e2e8f0;
    --text-strong: #ffffff;
    --text-dim: #94a3b8;
    --text-mute: #64748b;
    --border: rgba(148,163,184,0.14);
    --accent: #3b82f6;
    --good: #22c55e;
    --warn: #f59e0b;
    --danger: #ef4444;
  }

  :root[data-theme="light"] {
    --bg: #f1f5f9;
    --panel: #ffffff;
    --panel-2: #f8fafc;
    --text: #0f172a;
    --text-strong: #0f172a;
    --text-dim: #475569;
    --text-mute: #94a3b8;
    --border: rgba(15,23,42,0.10);
    --accent: #2563eb;
    --good: #16a34a;
    --warn: #d97706;
    --danger: #dc2626;
  }

  html, body {
    height: 100%; width: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: Roboto, Helvetica, Arial, sans-serif;
    font-size: 13px;
    overflow: hidden;
  }
  body { opacity: 0; transition: opacity 0.35s ease-out; padding: 16px; }
  body.ready { opacity: 1; }

  .header {
    display: flex; align-items: center; justify-content: space-between;
    height: 48px; padding: 0 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: 12px;
  }
  .title { font-size: 16px; font-weight: 700; color: var(--text-strong); }
  .meta { font-size: 11px; color: var(--text-dim); letter-spacing: 0.05em; text-transform: uppercase; }

  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 12px; }
  .kpi {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 14px;
  }
  .kpi-label { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-mute); margin-bottom: 4px; }
  .kpi-value { font-size: 22px; font-weight: 700; color: var(--text-strong); }
  .kpi-value.good   { color: var(--good); }
  .kpi-value.warn   { color: var(--warn); }
  .kpi-value.danger { color: var(--danger); }

  .table-wrap {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: auto;
    max-height: calc(100vh - 220px);
  }
  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left; padding: 10px 12px;
    font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--text-mute);
    background: var(--panel-2);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0;
  }
  td {
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
  }
  tr:last-child td { border-bottom: none; }

  .pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .pill.good   { background: rgba(34,197,94,0.12);  color: var(--good);   border: 1px solid rgba(34,197,94,0.3);  }
  .pill.warn   { background: rgba(245,158,11,0.12); color: var(--warn);   border: 1px solid rgba(245,158,11,0.3); }
  .pill.danger { background: rgba(239,68,68,0.12);  color: var(--danger); border: 1px solid rgba(239,68,68,0.3);  }
</style>
</head>
<body>

<div class="header">
  <div class="title" id="header-title">Operations Dashboard</div>
  <div class="meta" id="header-meta">Loading…</div>
</div>

<div class="kpis" id="kpis"></div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Status</th>
        <th>Value</th>
        <th>Updated</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</div>

<script>
// ─────────────────────────────────────────────────────────────
// SPLIT POINT — the saved script injects "const STATE = {...};" here
// Everything ABOVE this line is TPL_HEAD (ending with "const STATE = ")
// Everything BELOW this line is TPL_TAIL (starting with ";\n// Render...")
// ─────────────────────────────────────────────────────────────

const STATE = {
  // Example state shape — the saved script's buildDashboardState produces this
  title: 'Operations Dashboard',
  timeZone: 'UTC',
  kpis: [
    { label: 'Active', value: 12, tone: 'good' },
    { label: 'Idle',   value: 3,  tone: '' },
    { label: 'Down',   value: 1,  tone: 'danger' },
    { label: 'Total',  value: 16, tone: '' }
  ],
  rows: [
    { name: 'Unit A1', status: 'good',   value: 98,  updatedAt: '2026-01-15T14:32:00Z' },
    { name: 'Unit A2', status: 'warn',   value: 72,  updatedAt: '2026-01-15T14:30:00Z' },
    { name: 'Unit A3', status: 'danger', value: 12,  updatedAt: '2026-01-15T14:25:00Z' }
  ]
};

// ─────────────────────────────────────────────────────────────
// TPL_TAIL begins below
// ─────────────────────────────────────────────────────────────

const TZ = STATE.timeZone || 'UTC';
const timeFormatter = new Intl.DateTimeFormat('en-US', {
  timeZone: TZ,
  hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
});

function formatTime(iso) {
  if (!iso) return '—';
  try { return timeFormatter.format(new Date(iso)); }
  catch (e) { return '—'; }
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function render() {
  document.getElementById('header-title').textContent = STATE.title || 'Dashboard';
  document.getElementById('header-meta').textContent =
    'Last refresh: ' + timeFormatter.format(new Date()) + '  ·  TZ: ' + TZ;

  const kpisEl = document.getElementById('kpis');
  kpisEl.innerHTML = STATE.kpis.map((k) => `
    <div class="kpi">
      <div class="kpi-label">${escapeHtml(k.label)}</div>
      <div class="kpi-value ${escapeHtml(k.tone || '')}">${escapeHtml(k.value)}</div>
    </div>
  `).join('');

  const rowsEl = document.getElementById('rows');
  rowsEl.innerHTML = STATE.rows.map((r) => `
    <tr>
      <td>${escapeHtml(r.name)}</td>
      <td><span class="pill ${escapeHtml(r.status)}">${escapeHtml(r.status)}</span></td>
      <td>${escapeHtml(r.value)}</td>
      <td style="color: var(--text-dim)">${formatTime(r.updatedAt)}</td>
    </tr>
  `).join('');
}

render();

requestAnimationFrame(() => {
  document.body.classList.add('ready');
});
</script>

</body>
</html>
